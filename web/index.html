<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMExpert · Test Management</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">T</span><span>TMExpert</span></div><div class="workspace">WORKSPACE</div>
    <nav><button class="nav active" data-view="dashboard"><span>▦</span> Dashboard</button><button class="nav" data-view="workspace"><span>☑</span> My Work</button><button class="nav" data-view="projects"><span>▤</span> Projects</button><button class="nav" data-view="repository"><span>▱</span> Test Repository</button><button class="nav" data-view="suites"><span>▦</span> Test Suites</button><button class="nav" data-view="plans"><span>□</span> Test Plans</button><button class="nav" data-view="execution"><span>▶</span> Test Execution</button><button class="nav" data-view="defects"><span>✱</span> Defects</button><button class="nav" data-view="compare"><span>⇄</span> Compare Cycles</button><button class="nav" data-view="reports"><span>◔</span> Reports</button><button class="nav" data-view="audit" data-requires="audit.read" hidden><span>⌕</span> Audit Log</button><button class="nav" data-view="admin" data-requires="users.manage" hidden><span>⚙</span> Administration</button></nav>
    <div class="storage-note"><span class="status-dot"></span> Excel storage protected</div>
  </aside>
  <main><header><select class="project-select" id="projectSelect" aria-label="Current project"><option>Loading project…</option></select><div class="global-search"><span>⌕</span><input id="search" placeholder="Search records by ID, title, or tag"><kbd id="searchShortcut">Ctrl K</kbd></div><div id="userMenu" class="user-menu"></div></header>
  <section id="app" class="content"></section></main>
</div><div id="toast" class="toast"></div><div id="folderContextMenu" class="folder-context-menu" hidden></div><div id="confirmModal" class="modal-overlay" hidden><div class="modal" role="dialog" aria-modal="true"><h2 id="confirmTitle">Archive?</h2><p id="confirmMessage"></p><div id="deleteProgress" class="delete-progress" hidden><div class="delete-progress-bar"><span id="deleteProgressFill"></span></div><p id="deleteProgressText" class="delete-progress-text"></p></div><div class="modal-actions"><button id="confirmNo" class="button secondary">No</button><button id="confirmYes" class="button danger">Yes, archive</button></div></div></div><script src="/app.js"></script></body></html>
